<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F3EF">
<title>Nadel &amp; Faden – Änderungsschneiderei</title>
<style>
:root{--bg:#F5F3EF;--ink:#222;--m:#777;--l:#D9D4CB;--acc:#2F5DA8;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--sans)}
.w{max-width:480px;margin:0 auto;padding:48px 24px 40px}
.mark{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:20px}
h1{font-weight:500;font-size:40px;line-height:1.1;letter-spacing:-.03em;margin:26px 0 8px}
.lead{color:var(--m);margin:0}
.thread{height:24px;margin:30px 0;background:repeating-linear-gradient(90deg,var(--l) 0 10px,transparent 10px 18px) center/100% 1.5px no-repeat}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 18px}
dt{color:var(--m)}
dd{margin:0;text-align:right}
.acts{display:grid;gap:10px;margin-top:34px}
.acts button{padding:16px;border-radius:12px;font:600 16px var(--sans);cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.acts button:first-child{background:var(--ink);color:#fff}
.adr{margin-top:34px;font-size:15px;color:var(--m)}
.adr b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<main class="w">
  <div class="mark">✂</div>
  <h1>Nadel &amp; Faden</h1>
  <p class="lead">Änderungen und Reparaturen für Kleidung – schnell, sauber, fair.</p>
  <div class="thread"></div>
  <dl>
    <dt>Hose kürzen</dt><dd>ab 8 €</dd>
    <dt>Reißverschluss</dt><dd>ab 12 €</dd>
    <dt>Jacke enger</dt><dd>ab 18 €</dd>
    <dt>Vorhänge kürzen</dt><dd>ab 15 €</dd>
  </dl>
  <div class="thread"></div>
  <dl>
    <dt>Mo – Fr</dt><dd>9 – 18 Uhr</dd>
    <dt>Sa</dt><dd>9 – 13 Uhr</dd>
  </dl>
  <div class="acts">
    <button onclick="demoSend('Anruf bei Nadel & Faden: 02262 000000', '📞 Würde direkt anrufen:')">Anrufen</button>
    <button onclick="demoSend('Hallo, kann ich morgen eine Hose zum Kürzen vorbeibringen?')">WhatsApp</button>
  </div>
  <p class="adr"><b>Nadel &amp; Faden</b><br>Marktplatz 7 · 51674 Wiehl</p>
</main>
<script src="_demo.js"></script>
</body>
</html>
